name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Varsayilan GITHUB_TOKEN izinleri en dar kapsamda tutulur. Hicbir is yazma
# iznine ihtiyac duymaz; gerekirse is duzeyinde acikca genisletilir.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

# Ucuncu taraf action KULLANILMAZ. Ilk taraf action'lar da hareketli etikete
# degil degismez commit SHA'sina sabitlenir (bir etiket yeniden isaretlenebilir,
# SHA isaretlenemez). Yorumdaki surum yalnizca okunabilirlik icindir.
jobs:
  # =========================================================================
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python kurulumu
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --- BLOKLAYAN kalite kapıları --------------------------------------
      - name: Lint (ruff) [bloklayıcı]
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Biçim denetimi (black) [bloklayıcı]
        working-directory: backend
        run: black --check .

      # --- BİLGİLENDİRİCİ kapı --------------------------------------------
      # mypy bilinçli olarak bloklayıcı DEĞİLDİR: kod tabanında kapatılmamış
      # tip borcu vardır (bkz. docs/known-limitations.md). Bu adım raporlar,
      # derlemeyi düşürmez ve bu durum adında da yazılıdır.
      - name: Tip denetimi (mypy) [bilgilendirici, bloklamaz]
        working-directory: backend
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Migration doğrulaması
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
        run: |
          alembic upgrade head
          alembic check

      - name: Testler (pytest) [bloklayıcı]
        working-directory: backend
        run: pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Kapsam raporunu yükle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # =========================================================================
  frontend:
    name: Frontend (lint · types · build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node kurulumu
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Tip denetimi [bloklayıcı]
        working-directory: frontend
        run: npm run typecheck

      - name: Lint [bloklayıcı]
        working-directory: frontend
        run: npm run lint

      - name: Derleme [bloklayıcı]
        working-directory: frontend
        run: npm run build

      - name: Çeviri bütünlüğü (TR ↔ EN)
        working-directory: frontend
        run: |
          node -e "
          const fs = require('fs');
          const flat = (o, p = '') => Object.entries(o).flatMap(([k, v]) =>
            v && typeof v === 'object' ? flat(v, p + k + '.') : [p + k]);
          const tr = flat(JSON.parse(fs.readFileSync('src/locales/tr/translation.json', 'utf8')));
          const en = flat(JSON.parse(fs.readFileSync('src/locales/en/translation.json', 'utf8')));
          const missingEn = tr.filter(k => !en.includes(k));
          const missingTr = en.filter(k => !tr.includes(k));
          console.log(\`TR: \${tr.length} anahtar, EN: \${en.length} anahtar\`);
          if (missingEn.length) console.error('EN eksik:', missingEn.join(', '));
          if (missingTr.length) console.error('TR eksik:', missingTr.join(', '));
          process.exit(missingEn.length + missingTr.length ? 1 : 0);
          "

      - name: Derlemeyi yükle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # =========================================================================
  security:
    name: Güvenlik (secret scan · dependency audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # NOT: Bu adim yalnizca METIN dosyalarini tarar. Ikili dosyalar (PDF,
      # PPTX, PNG) taranmaz; sunum varliklari bu yuzden ayrica denetlenir
      # (bkz. SECURITY.md > "Yayimlama oncesi denetim").
      - name: Gizli anahtar taraması (metin dosyaları) [bloklayıcı]
        run: |
          echo "Kaynak kodda API anahtarı aranıyor..."
          FOUND=0
          for PATTERN in 'nvapi-[A-Za-z0-9_-]\{20,\}' \
                         'sk-[A-Za-z0-9]\{32,\}' \
                         'gh[pousr]_[A-Za-z0-9]\{30,\}' \
                         'AKIA[0-9A-Z]\{16\}' \
                         'BEGIN \(RSA\|OPENSSH\|EC\) PRIVATE KEY'; do
            if grep -rInE "$PATTERN" \
                 --include='*.py' --include='*.ts' --include='*.tsx' \
                 --include='*.js' --include='*.json' --include='*.md' \
                 --include='*.yml' --include='*.ps1' --include='*.bat' \
                 --exclude-dir=node_modules --exclude-dir=.git \
                 --exclude-dir=.venv --exclude-dir=dist . ; then
              echo "::error::Gizli anahtar deseni bulundu: $PATTERN"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "Temiz: gizli anahtar bulunamadı."

      - name: .env commit edilmemiş mi? [bloklayıcı]
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env dosyası depoya eklenmiş!"
            exit 1
          fi
          echo ".env depoda değil."

      - name: .gitignore .env içeriyor mu? [bloklayıcı]
        run: |
          if ! grep -qE '^\.env$' .gitignore; then
            echo "::error::.gitignore içinde .env satırı yok!"
            exit 1
          fi
          echo ".gitignore doğru yapılandırılmış."

      - name: Sunum üretim çıktısı depoda mı? [bloklayıcı]
        run: |
          STRAY=$(git ls-files 'sunum/*.pdf' 'sunum/*.pptx' 'sunum/*.html' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::Sunum üretim çıktısı depoya eklenmiş: $STRAY"
            exit 1
          fi
          echo "Sunum üretim çıktısı depoda değil."

      # Bilgilendirici: yeni bir CVE yayimlandiginda derlemeyi kirmaz ama
      # loga yazar. Yukseltmeler dependabot ile onerilir.
      - name: Bağımlılık güvenlik taraması [bilgilendirici, bloklamaz]
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

  # =========================================================================
  integration:
    name: Entegrasyon (API dumanı testi)
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıkları kur
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sunucuyu başlat, ilk kurulumu tamamla ve uçları doğrula
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_smoke.db
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          LOCAL_AI_ENABLED: 'false'
          NVIDIA_ENABLED: 'false'
          SEED_DEMO_DATA: 'false'
        run: |
          set -euo pipefail
          alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/ping > /dev/null; then break; fi
            sleep 1
          done

          echo "--- Sağlık kontrolü ---"
          curl -sf http://127.0.0.1:8000/api/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo ""
          echo "--- İlk kurulum kapısı: admin/admin yalnızca yerelden ---"
          BOOT_TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin","password":"admin"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          test -n "$BOOT_TOKEN"

          echo "--- Parola değişmeden korumalı uç KAPALI olmalı ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $BOOT_TOKEN" \
            http://127.0.0.1:8000/api/v1/students)
          if [ "$CODE" != "403" ]; then
            echo "::error::Parola değişmeden /students erişilebildi (HTTP $CODE)"
            exit 1
          fi

          echo "--- Uzaktan (vekil arkasından) kurulum girişi reddedilmeli ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -H 'X-Forwarded-For: 203.0.113.7' \
            -d '{"email":"admin","password":"admin"}')
          if [ "$CODE" != "403" ]; then
            echo "::error::Uzaktan kurulum girişi kabul edildi (HTTP $CODE)"
            exit 1
          fi

          echo "--- Parola değişimi ---"
          curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/change-password \
            -H "Authorization: Bearer $BOOT_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"current_password":"admin","new_password":"Ci-Smoke-Pass-2026x1"}' > /dev/null

          echo "--- admin/admin artık geçersiz olmalı ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin","password":"admin"}')
          if [ "$CODE" != "401" ]; then
            echo "::error::Kurulum parolası değişimden sonra hâlâ çalışıyor (HTTP $CODE)"
            exit 1
          fi

          echo "--- Giriş ---"
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin","password":"Ci-Smoke-Pass-2026x1"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          test -n "$TOKEN"

          echo "--- Yetkili uçlar ---"
          for ENDPOINT in students instructors pools statistics/dashboard \
                          reports/definitions ai/control-center backup/status \
                          training/tutorials; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              "http://127.0.0.1:8000/api/v1/$ENDPOINT")
            echo "  /$ENDPOINT -> $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::/$ENDPOINT beklenen 200 yerine $CODE döndü"
              exit 1
            fi
          done

          echo "--- Yetkisiz erişim 401 dönmeli ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/students)
          test "$CODE" = "401"

          echo "--- SPA geri düşüşü dizin dışına çıkamaz ---"
          for URL in '/../.env' '/../../.env' '/..%2f..%2f.env'; do
            BODY=$(curl -s --path-as-is "http://127.0.0.1:8000$URL" || true)
            if echo "$BODY" | grep -q 'SECRET_KEY'; then
              echo "::error::Yol geçişi ile .env okundu: $URL"
              exit 1
            fi
          done
          echo "Duman testi tamam."
